              func showLockCover() {
                  if lockCover.superview != nil { return }
                  view.addSubview(lockCover)
                  NSLayoutConstraint.activate([
                      lockCover.topAnchor.constraint(equalTo: view.topAnchor),
                      lockCover.bottomAnchor.constraint(equalTo: view.bottomAnchor),
