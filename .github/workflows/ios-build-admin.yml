              @objc func willForeground() {
                  guard splashGone, let bg = backgroundDate else { return }
                  backgroundDate = nil
                  let d = UserDefaults.standard
                  guard d.bool(forKey: kRequireAuth) else { return }
                  let limit = d.integer(forKey: kAutoLock)
