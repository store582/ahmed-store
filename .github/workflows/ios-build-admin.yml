                      splash.trailingAnchor.constraint(equalTo: view.trailingAnchor)
                  ])

                  // حاوية الشعار + الحلقات المتوسعة
                  let logoBox = UIView()
                  logoBox.translatesAutoresizingMaskIntoConstraints = false
                  logoBox.widthAnchor.constraint(equalToConstant: 200).isActive = true
                  logoBox.heightAnchor.constraint(equalToConstant: 200).isActive = true

                  for i in 0..<3 {
                      let ring = CAShapeLayer()
                      ring.frame = CGRect(x: 0, y: 0, width: 200, height: 200)
                      ring.path = UIBezierPath(ovalIn: ring.bounds).cgPath
                      ring.fillColor = UIColor.clear.cgColor
                      ring.strokeColor = storeAmber.cgColor
                      ring.lineWidth = 2
                      ring.opacity = 0
                      logoBox.layer.addSublayer(ring)

                      let scale = CABasicAnimation(keyPath: "transform.scale")
                      scale.fromValue = 0.4
                      scale.toValue = 1.0
                      let fade = CABasicAnimation(keyPath: "opacity")
                      fade.fromValue = 0.7
                      fade.toValue = 0.0
                      let group = CAAnimationGroup()
                      group.animations = [scale, fade]
                      group.duration = 2.4
                      group.repeatCount = .infinity
                      group.beginTime = CACurrentMediaTime() + Double(i) * 0.8
                      group.timingFunction = CAMediaTimingFunction(name: .easeOut)
                      ring.add(group, forKey: "ring")
                  }

                  let logo = UILabel()
                  logo.text = "ب"
                  logo.font = UIFont.systemFont(ofSize: 44, weight: .black)
                  logo.textColor = storeGreen
                  logo.textAlignment = .center
                  logo.backgroundColor = storeAmber
                  logo.layer.cornerRadius = 26
                  logo.layer.masksToBounds = true
                  logo.layer.borderWidth = 3
                  logo.layer.borderColor = storeAmber.cgColor
                  if let limg = appLogoImage() {
                      logo.text = ""
                      let iv = UIImageView(image: limg)
                      iv.contentMode = .scaleAspectFill
                      iv.translatesAutoresizingMaskIntoConstraints = false
                      logo.addSubview(iv)
                      NSLayoutConstraint.activate([
                          iv.topAnchor.constraint(equalTo: logo.topAnchor),
                          iv.bottomAnchor.constraint(equalTo: logo.bottomAnchor),
                          iv.leadingAnchor.constraint(equalTo: logo.leadingAnchor),
                          iv.trailingAnchor.constraint(equalTo: logo.trailingAnchor)
                      ])
                  }
                  logo.translatesAutoresizingMaskIntoConstraints = false
                  logoBox.addSubview(logo)
                  NSLayoutConstraint.activate([
                      logo.centerXAnchor.constraint(equalTo: logoBox.centerXAnchor),
                      logo.centerYAnchor.constraint(equalTo: logoBox.centerYAnchor),
                      logo.widthAnchor.constraint(equalToConstant: 116),
                      logo.heightAnchor.constraint(equalToConstant: 116)
                  ])

                  let title = UILabel()
                  title.text = "مجمع البسام"
                  title.font = UIFont.systemFont(ofSize: 28, weight: .heavy)
                  title.textColor = .white
                  title.textAlignment = .center

                  let subtitle = UILabel()
                  subtitle.text = "لوحة الإدارة"
                  subtitle.font = UIFont.systemFont(ofSize: 16, weight: .medium)
                  subtitle.textColor = storeAmber.withAlphaComponent(0.85)
                  subtitle.textAlignment = .center

                  splashSpinner.color = storeAmber
                  splashSpinner.startAnimating()

                  retryAuthButton.setTitle("فتح التطبيق", for: .normal)
                  retryAuthButton.setTitleColor(storeAmber, for: .normal)
                  retryAuthButton.titleLabel?.font = UIFont.systemFont(ofSize: 18, weight: .bold)
                  retryAuthButton.addTarget(self, action: #selector(retryAuth), for: .touchUpInside)
                  retryAuthButton.isHidden = true

                  let stack = UIStackView(arrangedSubviews: [logoBox, title, subtitle, splashSpinner, retryAuthButton])
                  stack.axis = .vertical
                  stack.alignment = .center
                  stack.spacing = 10
                  stack.setCustomSpacing(24, after: subtitle)
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  splash.addSubview(stack)
                  NSLayoutConstraint.activate([
                      stack.centerXAnchor.constraint(equalTo: splash.centerXAnchor),
                      stack.centerYAnchor.constraint(equalTo: splash.centerYAnchor)
                  ])

                  // حركة الدخول: الشعار بقفزة ناعمة، والنصوص تظهر تدريجياً
                  logo.transform = CGAffineTransform(scaleX: 0.2, y: 0.2)
                  logo.alpha = 0
                  title.alpha = 0
                  title.transform = CGAffineTransform(translationX: 0, y: 14)
                  subtitle.alpha = 0
                  subtitle.transform = CGAffineTransform(translationX: 0, y: 14)

                  DispatchQueue.main.async {
                      UIView.animate(withDuration: 0.8, delay: 0.1, usingSpringWithDamping: 0.55, initialSpringVelocity: 0.8, options: [], animations: {
                          logo.transform = .identity
                          logo.alpha = 1
                      }, completion: { _ in
                          let pulse = CABasicAnimation(keyPath: "transform.scale")
                          pulse.fromValue = 1.0
                          pulse.toValue = 1.07
                          pulse.duration = 0.9
                          pulse.autoreverses = true
                          pulse.repeatCount = .infinity
                          pulse.timingFunction = CAMediaTimingFunction(name: .easeInEaseOut)
                          logo.layer.add(pulse, forKey: "pulse")
                      })
                      UIView.animate(withDuration: 0.6, delay: 0.5, options: .curveEaseOut, animations: {
                          title.alpha = 1
                          title.transform = .identity
                      })
                      UIView.animate(withDuration: 0.6, delay: 0.75, options: .curveEaseOut, animations: {
                          subtitle.alpha = 1
                          subtitle.transform = .identity
                      })
                  }
              }

              func tryHideSplash() {
                  guard !splashGone, splashTimeUp, pageReady, authOK else { return }
                  splashGone = true
                  UIView.animate(withDuration: 0.6, animations: {
                      self.splash.alpha = 0
                      self.splash.transform = CGAffineTransform(scaleX: 1.08, y: 1.08)
                  }, completion: { _ in
                      self.splash.removeFromSuperview()
                  })
              }

              // ---------- القفل (اختياري من الإعدادات) ----------
              func authenticate() {
                  if !UserDefaults.standard.bool(forKey: kRequireAuth) {
                      authOK = true
                      tryHideSplash()
                      return
                  }
                  Auth.verify(reason: "افتح لوحة إدارة مجمع البسام") { ok in
                      if ok {
                          self.authOK = true
                          self.retryAuthButton.isHidden = true
                          self.splashSpinner.startAnimating()
                          self.tryHideSplash()
                      } else {
                          self.splashSpinner.stopAnimating()
                          self.retryAuthButton.isHidden = false
                      }
                  }
              }

              @objc func retryAuth() {
                  retryAuthButton.isHidden = true
                  splashSpinner.startAnimating()
                  authenticate()
              }

