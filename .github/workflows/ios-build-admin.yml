          # الاسم العربي يظهر على الشاشة عبر ملفات الترجمة (Info.plist يبقى بحروف إنجليزية حتى يقبله AltStore)
          for L in en ar; do
            mkdir -p build/Payload/AlbsamApp.app/$L.lproj
            printf '"CFBundleDisplayName" = "إدارة مجمع البسام";\n' > build/Payload/AlbsamApp.app/$L.lproj/InfoPlist.strings
          done

          codesign --force --deep --sign - build/Payload/AlbsamApp.app
          cd build && zip -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/app.ipa
