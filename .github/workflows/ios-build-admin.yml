name: Build iOS App
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Direct IPA with Fullscreen Fix
        run: |
          mkdir -p build/Payload/AlbsamApp.app

          cat << 'EOF' > main.swift
          import UIKit
          import WebKit
          import AVFoundation
          import LocalAuthentication
          import UserNotifications

          // ===== إعدادات ثابتة =====
          let splashSeconds: TimeInterval = 2.5  // مدة شاشة الترحيب
          let adminURL = "https://bsamjasm.github.io/albsam_store/admin.html"

          let storeGreen = UIColor(red: 0.04, green: 0.21, blue: 0.13, alpha: 1)
          let storeGreenLight = UIColor(red: 0.08, green: 0.34, blue: 0.21, alpha: 1)
          let storeGreenDark = UIColor(red: 0.02, green: 0.11, blue: 0.07, alpha: 1)
          let storeAmber = UIColor(red: 0.984, green: 0.749, blue: 0.141, alpha: 1)

          // ===== مفاتيح الإعدادات (تُحفظ في الجوال) =====
          let kRequireAuth = "requireAuth"
          let kKeepAwake = "keepAwake"
          let kHaptic = "haptic"
          let kNight = "night"
          let kFontScale = "fontScale"
          let kAutoLock = "autoLock"
          let kSecureActions = "secureActions"
          var pendingShortcut: String?

          // ===== أدوات القفل =====
          enum Auth {
              static func isAvailable() -> Bool {
                  var err: NSError?
                  return LAContext().canEvaluatePolicy(.deviceOwnerAuthentication, error: &err)
              }
              static func verify(reason: String, completion: @escaping (Bool) -> Void) {
                  let ctx = LAContext()
                  var err: NSError?
                  if ctx.canEvaluatePolicy(.deviceOwnerAuthentication, error: &err) {
                      ctx.evaluatePolicy(.deviceOwnerAuthentication, localizedReason: reason) { ok, _ in
                          DispatchQueue.main.async { completion(ok) }
                      }
                  } else {
                      completion(true)
                  }
              }
          }

          func makeDot(diameter: CGFloat) -> CGImage? {
              let size = CGSize(width: diameter, height: diameter)
              let renderer = UIGraphicsImageRenderer(size: size)
              let img = renderer.image { _ in
                  UIColor.white.setFill()
                  UIBezierPath(ovalIn: CGRect(origin: .zero, size: size)).fill()
              }
              return img.cgImage
          }

          // ===== شاشة الترحيب: خلفية خضراء متحركة + نقاط صاعدة =====
          func appLogoFile() -> URL {
              return FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask)[0].appendingPathComponent("applogo.png")
          }

          func appLogoImage() -> UIImage? {
              if let lp = Bundle.main.path(forResource: "logo", ofType: "png"), let bi = UIImage(contentsOfFile: lp) { return bi }
              if let d = try? Data(contentsOf: appLogoFile()), let i = UIImage(data: d) { return i }
              return nil
          }

          // يجلب شعار المتجر من لوحة الأدمن ويحفظه ليظهر في شاشة الترحيب عند الفتح التالي
          func refreshAppLogo() {
              guard let u = URL(string: "https://albsam-store-default-rtdb.firebaseio.com/settings/logoImage.json") else { return }
              URLSession.shared.dataTask(with: u) { data, _, _ in
                  guard let data = data, let raw = String(data: data, encoding: .utf8) else { return }
                  let url = raw.replacingOccurrences(of: "\\/", with: "/").trimmingCharacters(in: CharacterSet(charactersIn: "\" \n"))
                  let ud = UserDefaults.standard
                  if url == "null" || url.isEmpty {
                      try? FileManager.default.removeItem(at: appLogoFile())
                      ud.removeObject(forKey: "applogo_url")
                      return
                  }
                  if ud.string(forKey: "applogo_url") == url { return }
                  guard let iu = URL(string: url) else { return }
                  URLSession.shared.dataTask(with: iu) { d, _, _ in
                      if let d = d, let img = UIImage(data: d), let png = img.pngData() {
                          try? png.write(to: appLogoFile())
                          ud.set(url, forKey: "applogo_url")
                      }
                  }.resume()
              }.resume()
          }

          class SplashView: UIView {
              let gradient = CAGradientLayer()
              let emitterBig = CAEmitterLayer()
              let emitterSmall = CAEmitterLayer()

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  setup()
              }
              required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }

              func makeCell(color: UIColor, diameter: CGFloat, birth: Float, scale: CGFloat, lifetime: Float, rise: CGFloat) -> CAEmitterCell {
                  let c = CAEmitterCell()
                  c.contents = makeDot(diameter: diameter)
                  c.birthRate = birth
                  c.lifetime = lifetime
                  c.velocity = 18
                  c.velocityRange = 14
                  c.emissionRange = .pi * 2
                  c.yAcceleration = -rise
                  c.xAcceleration = 2
                  c.scale = scale
                  c.scaleRange = scale * 0.6
                  c.scaleSpeed = -scale / CGFloat(lifetime) * 0.4
                  c.color = color.cgColor
                  c.alphaRange = 0.35
                  c.alphaSpeed = -0.9 / lifetime
                  return c
              }

              func setup() {
                  backgroundColor = storeGreen

                  gradient.colors = [storeGreenDark.cgColor, storeGreen.cgColor]
                  gradient.startPoint = CGPoint(x: 0.5, y: 0)
                  gradient.endPoint = CGPoint(x: 0.5, y: 1)
                  layer.addSublayer(gradient)

                  // حركة تدرج اللون الأخضر (تنفّس بطيء)
                  let shift = CABasicAnimation(keyPath: "colors")
                  shift.fromValue = [storeGreenDark.cgColor, storeGreen.cgColor]
                  shift.toValue = [storeGreen.cgColor, storeGreenLight.cgColor]
                  shift.duration = 3.5
                  shift.autoreverses = true
                  shift.repeatCount = .infinity
                  shift.timingFunction = CAMediaTimingFunction(name: .easeInEaseOut)
                  gradient.add(shift, forKey: "shift")

                  // نقاط ذهبية كبيرة تصعد ببطء
                  emitterBig.emitterShape = .line
                  emitterBig.renderMode = .additive
                  emitterBig.emitterCells = [
                      makeCell(color: storeAmber.withAlphaComponent(0.75), diameter: 14, birth: 3.5, scale: 0.7, lifetime: 12, rise: 12)
                  ]
                  layer.addSublayer(emitterBig)

                  // نقاط بيضاء صغيرة خافتة (طبقة عمق ثانية)
                  emitterSmall.emitterShape = .line
                  emitterSmall.renderMode = .additive
                  emitterSmall.emitterCells = [
                      makeCell(color: UIColor.white.withAlphaComponent(0.45), diameter: 8, birth: 6, scale: 0.5, lifetime: 14, rise: 8)
                  ]
                  layer.addSublayer(emitterSmall)
              }

              override func layoutSubviews() {
                  super.layoutSubviews()
                  gradient.frame = bounds
                  for e in [emitterBig, emitterSmall] {
                      e.frame = bounds
                      e.emitterPosition = CGPoint(x: bounds.midX, y: bounds.maxY + 10)
                      e.emitterSize = CGSize(width: bounds.width, height: 1)
                  }
              }
          }

          class WeakHandler: NSObject, WKScriptMessageHandler {
              weak var target: WKScriptMessageHandler?
              init(_ t: WKScriptMessageHandler) { target = t }
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  target?.userContentController(userContentController, didReceive: message)
              }
          }

          // ===== شاشة الإعدادات =====
          class SettingsViewController: UIViewController {
              var onReload: (() -> Void)?
              var onAppearance: (() -> Void)?
              var onClearCache: (() -> Void)?
              let lockSwitch = UISwitch()
              let secureSwitch = UISwitch()
              let awakeSwitch = UISwitch()
              let hapticSwitch = UISwitch()
              let nightSwitch = UISwitch()
              let lockSeg = UISegmentedControl(items: ["فوراً", "دقيقة", "5 دقائق", "أبداً"])
              let fontSeg = UISegmentedControl(items: ["صغير", "عادي", "كبير"])
              let lockDelays = [0, 60, 300, -1]

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .systemBackground
                  let d = UserDefaults.standard

                  let title = UILabel()
                  title.text = "الإعدادات"
                  title.font = UIFont.systemFont(ofSize: 24, weight: .heavy)
                  title.textColor = storeGreen
                  title.textAlignment = .right

                  lockSwitch.isOn = d.bool(forKey: kRequireAuth)
                  secureSwitch.isOn = d.bool(forKey: kSecureActions)
                  awakeSwitch.isOn = d.bool(forKey: kKeepAwake)
                  hapticSwitch.isOn = d.bool(forKey: kHaptic)
                  nightSwitch.isOn = d.bool(forKey: kNight)
                  for sw in [lockSwitch, secureSwitch, awakeSwitch, hapticSwitch, nightSwitch] { sw.onTintColor = storeGreen }
                  lockSwitch.addTarget(self, action: #selector(lockChanged(_:)), for: .valueChanged)
                  secureSwitch.addTarget(self, action: #selector(secureChanged(_:)), for: .valueChanged)
                  awakeSwitch.addTarget(self, action: #selector(awakeChanged(_:)), for: .valueChanged)
                  hapticSwitch.addTarget(self, action: #selector(hapticChanged(_:)), for: .valueChanged)
                  nightSwitch.addTarget(self, action: #selector(nightChanged(_:)), for: .valueChanged)

                  lockSeg.selectedSegmentIndex = lockDelays.firstIndex(of: d.integer(forKey: kAutoLock)) ?? 1
                  lockSeg.addTarget(self, action: #selector(lockDelayChanged), for: .valueChanged)
                  fontSeg.selectedSegmentIndex = min(2, max(0, d.integer(forKey: kFontScale)))
                  fontSeg.addTarget(self, action: #selector(fontChanged), for: .valueChanged)

                  let reload = UIButton(type: .system)
                  reload.setTitle("إعادة تحميل اللوحة", for: .normal)
                  reload.setTitleColor(.white, for: .normal)
                  reload.backgroundColor = storeGreen
                  reload.titleLabel?.font = UIFont.systemFont(ofSize: 17, weight: .bold)
                  reload.layer.cornerRadius = 12
                  reload.heightAnchor.constraint(equalToConstant: 46).isActive = true
                  reload.addTarget(self, action: #selector(reloadTapped), for: .touchUpInside)

                  let clear = UIButton(type: .system)
                  clear.setTitle("مسح الكاش وبيانات الموقع", for: .normal)
                  clear.setTitleColor(.systemRed, for: .normal)
                  clear.titleLabel?.font = UIFont.systemFont(ofSize: 16, weight: .semibold)
                  clear.backgroundColor = UIColor.systemRed.withAlphaComponent(0.08)
                  clear.layer.cornerRadius = 12
                  clear.heightAnchor.constraint(equalToConstant: 46).isActive = true
                  clear.addTarget(self, action: #selector(clearTapped), for: .touchUpInside)

                  let version = UILabel()
                  let v = Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String ?? ""
                  version.text = "مجمع البسام – الإصدار \(v)"
                  version.font = UIFont.systemFont(ofSize: 13)
                  version.textColor = .secondaryLabel
                  version.textAlignment = .center

                  let views: [UIView] = [
                      title,
                      makeRow(title: "قفل التطبيق", subtitle: "طلب Face ID أو رمز الجوال عند فتح التطبيق", accessory: lockSwitch),
                      makeSegRow(title: "القفل التلقائي", subtitle: "يُطلب القفل عند الرجوع للتطبيق بعد هذه المدة", seg: lockSeg),
                      makeRow(title: "حماية العمليات الحساسة", subtitle: "Face ID قبل حذف منتج أو طلب أو التصدير أو النسخ الاحتياطي", accessory: secureSwitch),
                      makeRow(title: "إبقاء الشاشة مضاءة", subtitle: "منع انطفاء الشاشة أثناء استخدام اللوحة", accessory: awakeSwitch),
                      makeRow(title: "الاهتزاز عند الضغط", subtitle: "اهتزاز خفيف عند الضغط على الأزرار", accessory: hapticSwitch),
                      makeRow(title: "الوضع الليلي", subtitle: "خلفية داكنة للوحة الإدارة", accessory: nightSwitch),
                      makeSegRow(title: "حجم الخط", subtitle: "تكبير أو تصغير محتوى اللوحة", seg: fontSeg),
                      reload, clear, version
                  ]
                  let stack = UIStackView(arrangedSubviews: views)
                  stack.axis = .vertical
                  stack.spacing = 14
                  stack.translatesAutoresizingMaskIntoConstraints = false

                  let scroll = UIScrollView()
                  scroll.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scroll)
                  scroll.addSubview(stack)
                  NSLayoutConstraint.activate([
                      scroll.topAnchor.constraint(equalTo: view.topAnchor),
                      scroll.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      scroll.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scroll.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      stack.topAnchor.constraint(equalTo: scroll.contentLayoutGuide.topAnchor, constant: 28),
                      stack.bottomAnchor.constraint(equalTo: scroll.contentLayoutGuide.bottomAnchor, constant: -28),
                      stack.leadingAnchor.constraint(equalTo: scroll.frameLayoutGuide.leadingAnchor, constant: 22),
                      stack.trailingAnchor.constraint(equalTo: scroll.frameLayoutGuide.trailingAnchor, constant: -22)
                  ])
              }

              func styledTexts(title: String, subtitle: String) -> UIStackView {
                  let t = UILabel()
                  t.text = title
                  t.font = UIFont.systemFont(ofSize: 17, weight: .semibold)
                  t.textAlignment = .right
                  let s = UILabel()
                  s.text = subtitle
                  s.font = UIFont.systemFont(ofSize: 13)
                  s.textColor = .secondaryLabel
                  s.numberOfLines = 0
                  s.textAlignment = .right
                  let texts = UIStackView(arrangedSubviews: [t, s])
                  texts.axis = .vertical
                  texts.spacing = 3
                  return texts
              }

              func makeRow(title: String, subtitle: String, accessory: UIView) -> UIView {
                  let row = UIStackView(arrangedSubviews: [styledTexts(title: title, subtitle: subtitle), accessory])
                  row.axis = .horizontal
                  row.alignment = .center
                  row.spacing = 12
                  row.semanticContentAttribute = .forceRightToLeft
                  row.isLayoutMarginsRelativeArrangement = true
                  row.layoutMargins = UIEdgeInsets(top: 12, left: 14, bottom: 12, right: 14)
                  row.backgroundColor = UIColor.secondarySystemBackground
                  row.layer.cornerRadius = 14
                  return row
              }

              func makeSegRow(title: String, subtitle: String, seg: UISegmentedControl) -> UIView {
                  let row = UIStackView(arrangedSubviews: [styledTexts(title: title, subtitle: subtitle), seg])
                  row.axis = .vertical
                  row.spacing = 10
                  row.isLayoutMarginsRelativeArrangement = true
                  row.layoutMargins = UIEdgeInsets(top: 12, left: 14, bottom: 12, right: 14)
                  row.backgroundColor = UIColor.secondarySystemBackground
                  row.layer.cornerRadius = 14
                  return row
              }

              func showAlert(_ text: String) {
                  let a = UIAlertController(title: nil, message: text, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "حسناً", style: .default))
                  present(a, animated: true)
              }

              // تفعيل أو إلغاء إعداد أمني يتطلب تأكيد الهوية
              func protectedToggle(_ sender: UISwitch, key: String, reason: String) {
                  let want = sender.isOn
                  if want && !Auth.isAvailable() {
                      sender.setOn(false, animated: true)
                      showAlert("فعّل رمز المرور أو Face ID في إعدادات الجوال أولاً")
                      return
                  }
                  Auth.verify(reason: reason) { ok in
                      if ok {
                          UserDefaults.standard.set(want, forKey: key)
                          UIImpactFeedbackGenerator(style: .light).impactOccurred()
                      } else {
                          sender.setOn(!want, animated: true)
                      }
                  }
              }

              @objc func lockChanged(_ sender: UISwitch) {
                  protectedToggle(sender, key: kRequireAuth, reason: sender.isOn ? "تفعيل قفل التطبيق" : "إلغاء قفل التطبيق")
              }

              @objc func secureChanged(_ sender: UISwitch) {
                  protectedToggle(sender, key: kSecureActions, reason: sender.isOn ? "تفعيل حماية العمليات الحساسة" : "إلغاء حماية العمليات الحساسة")
              }

              @objc func lockDelayChanged() {
                  UserDefaults.standard.set(lockDelays[lockSeg.selectedSegmentIndex], forKey: kAutoLock)
              }

              @objc func awakeChanged(_ sender: UISwitch) {
                  UserDefaults.standard.set(sender.isOn, forKey: kKeepAwake)
                  UIApplication.shared.isIdleTimerDisabled = sender.isOn
                  UIImpactFeedbackGenerator(style: .light).impactOccurred()
              }

              @objc func hapticChanged(_ sender: UISwitch) {
                  UserDefaults.standard.set(sender.isOn, forKey: kHaptic)
                  if sender.isOn { UIImpactFeedbackGenerator(style: .medium).impactOccurred() }
              }

              @objc func nightChanged(_ sender: UISwitch) {
                  UserDefaults.standard.set(sender.isOn, forKey: kNight)
                  onAppearance?()
              }

              @objc func fontChanged() {
                  UserDefaults.standard.set(fontSeg.selectedSegmentIndex, forKey: kFontScale)
                  onAppearance?()
              }

              @objc func reloadTapped() {
                  dismiss(animated: true) { self.onReload?() }
              }

              @objc func clearTapped() {
                  let a = UIAlertController(title: "مسح الكاش", message: "سيُحذف أيضاً مفتاح الذكاء الاصطناعي وإعدادات الصوت المحفوظة في اللوحة.", preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  a.addAction(UIAlertAction(title: "مسح", style: .destructive) { _ in
                      self.dismiss(animated: true) { self.onClearCache?() }
                  })
                  present(a, animated: true)
              }
          }

          class ScannerViewController: UIViewController, AVCaptureMetadataOutputObjectsDelegate {
              var onCode: ((String) -> Void)?
              let session = AVCaptureSession()
              var preview: AVCaptureVideoPreviewLayer?
              var done = false
              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .black
                  guard let dev = AVCaptureDevice.default(for: .video), let input = try? AVCaptureDeviceInput(device: dev), session.canAddInput(input) else {
                      DispatchQueue.main.async { self.dismiss(animated: true) }
                      return
                  }
                  session.addInput(input)
                  let out = AVCaptureMetadataOutput()
                  if session.canAddOutput(out) {
                      session.addOutput(out)
                      out.setMetadataObjectsDelegate(self, queue: .main)
                      out.metadataObjectTypes = [.qr, .code128, .code39, .code93, .ean13, .ean8, .upce, .pdf417, .dataMatrix]
                  }
                  let layer = AVCaptureVideoPreviewLayer(session: session)
                  layer.videoGravity = .resizeAspectFill
                  view.layer.addSublayer(layer)
                  preview = layer
                  let close = UIButton(type: .system)
                  close.setTitle("إغلاق", for: .normal)
                  close.setTitleColor(.white, for: .normal)
                  close.backgroundColor = UIColor.black.withAlphaComponent(0.55)
                  close.layer.cornerRadius = 18
                  close.translatesAutoresizingMaskIntoConstraints = false
                  close.addTarget(self, action: #selector(closeTapped), for: .touchUpInside)
                  view.addSubview(close)
                  NSLayoutConstraint.activate([
                      close.widthAnchor.constraint(equalToConstant: 80),
                      close.heightAnchor.constraint(equalToConstant: 36),
                      close.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      close.bottomAnchor.constraint(equalTo: view.safeAreaLayoutGuide.bottomAnchor, constant: -24)
                  ])
                  DispatchQueue.global(qos: .userInitiated).async { self.session.startRunning() }
              }
              override func viewDidLayoutSubviews() {
                  super.viewDidLayoutSubviews()
                  preview?.frame = view.bounds
              }
              @objc func closeTapped() {
                  session.stopRunning()
                  dismiss(animated: true)
              }
              func metadataOutput(_ output: AVCaptureMetadataOutput, didOutput metadataObjects: [AVMetadataObject], from connection: AVCaptureConnection) {
                  guard !done, let obj = metadataObjects.first as? AVMetadataMachineReadableCodeObject, let str = obj.stringValue else { return }
                  done = true
                  UIImpactFeedbackGenerator(style: .medium).impactOccurred()
                  session.stopRunning()
                  dismiss(animated: true) { self.onCode?(str) }
              }
          }

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  UserDefaults.standard.register(defaults: [
                      kRequireAuth: true, kKeepAwake: true, kHaptic: true, kNight: false,
                      kFontScale: 1, kAutoLock: 60, kSecureActions: true
                  ])

                  // إذن شارة الأيقونة (عدد الطلبات الجديدة)
                  UNUserNotificationCenter.current().requestAuthorization(options: [.badge]) { _, _ in }

                  // الصوت يعمل حتى لو الجوال على وضع الصامت
                  _ = try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers])
                  _ = try? AVAudioSession.sharedInstance().setActive(true)
                  // منع انطفاء الشاشة (حسب الإعدادات)
                  application.isIdleTimerDisabled = UserDefaults.standard.bool(forKey: kKeepAwake)

                  if let item = launchOptions?[.shortcutItem] as? UIApplicationShortcutItem {
                      pendingShortcut = item.type
                  }

                  refreshAppLogo()
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = WebViewController()
                  window.makeKeyAndVisible()
                  self.window = window
                  return true
              }

              // اختصارات الأيقونة (ضغطة مطولة)
              func application(_ application: UIApplication, performActionFor shortcutItem: UIApplicationShortcutItem, completionHandler: @escaping (Bool) -> Void) {
                  pendingShortcut = shortcutItem.type
                  (window?.rootViewController as? WebViewController)?.runShortcut()
                  completionHandler(true)
              }
          }


          class WebViewController: UIViewController, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
              var webView: WKWebView!
              let splash = SplashView()
              let splashSpinner = UIActivityIndicatorView(style: .large)
              let retryAuthButton = UIButton(type: .system)
              let errorView = UIView()
              let progressBar = UIProgressView(progressViewStyle: .bar)
              let settingsButton = UIButton(type: .system)
              let lockCover = UIView()
              var backgroundDate: Date?
              var pageLoaded = false
              var progressObserver: NSKeyValueObservation?
              var splashTimeUp = false
              var pageReady = false
              var authOK = false
              var splashGone = false
              var authStarted = false

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .white

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                      let hapticJS = """
                      (function(){
                        document.addEventListener('click', function(e){
                          var t = e.target && e.target.closest ? e.target.closest('button,a,select,label') : null;
                          if (t && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native) {
                            window.webkit.messageHandlers.native.postMessage({type:'haptic'});
                          }
                        }, true);
                      })();
                      """
                      config.userContentController.add(WeakHandler(self), name: "native")
                      config.userContentController.addUserScript(WKUserScript(source: hapticJS, injectionTime: .atDocumentEnd, forMainFrameOnly: true))

                  webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  webView.scrollView.isScrollEnabled = true
                  webView.scrollView.bounces = true

                  let rc = UIRefreshControl()
                  rc.tintColor = storeGreen
                  rc.addTarget(self, action: #selector(reloadPage), for: .valueChanged)
                  webView.scrollView.refreshControl = rc

                  view.addSubview(webView)

                  NSLayoutConstraint.activate([
                      webView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      webView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: view.trailingAnchor)
                  ])

                  setupProgressBar()
                  setupSettingsButton()
                  setupLockCover()
                  NotificationCenter.default.addObserver(self, selector: #selector(didBackground), name: UIApplication.didEnterBackgroundNotification, object: nil)
                  NotificationCenter.default.addObserver(self, selector: #selector(willForeground), name: UIApplication.willEnterForegroundNotification, object: nil)
                  setupErrorView()
                  setupSplash()

                  if let url = URL(string: adminURL) {
                      webView.load(URLRequest(url: url))
                  }

                  DispatchQueue.main.asyncAfter(deadline: .now() + splashSeconds) {
                      self.splashTimeUp = true
                      self.tryHideSplash()
                  }
                  // أمان: لا تبقى شاشة الترحيب أكثر من 8 ثوانٍ بسبب بطء الشبكة
                  DispatchQueue.main.asyncAfter(deadline: .now() + 8) {
                      self.pageReady = true
                      self.tryHideSplash()
                  }
              }

              override func viewDidAppear(_ animated: Bool) {
                  super.viewDidAppear(animated)
                  if !authStarted {
                      authStarted = true
                      authenticate()
                  }
              }

              // ---------- رسائل الصفحة (Face ID للعمليات الحساسة، الاهتزاز، الشارة) ----------
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let body = message.body as? [String: Any], let type = body["type"] as? String else { return }
                  switch type {
                  case "haptic":
                      if UserDefaults.standard.bool(forKey: kHaptic) {
                          UIImpactFeedbackGenerator(style: .light).impactOccurred()
                      }
                  case "badge":
                      let n = (body["n"] as? NSNumber)?.intValue ?? 0
                      UIApplication.shared.applicationIconBadgeNumber = max(0, n)
                  case "auth":
                      let id = (body["id"] as? NSNumber)?.intValue ?? 0
                      let reason = body["reason"] as? String ?? "تأكيد العملية"
                      if !UserDefaults.standard.bool(forKey: kSecureActions) {
                          replyAuth(id, true)
                          return
                      }
                      Auth.verify(reason: reason) { ok in self.replyAuth(id, ok) }
                  case "share":
                      if let s = body["data"] as? String, let b64 = s.components(separatedBy: ",").last, let d = Data(base64Encoded: b64), let img = UIImage(data: d) {
                          let av = UIActivityViewController(activityItems: [img], applicationActivities: nil)
                          av.popoverPresentationController?.sourceView = view
                          av.popoverPresentationController?.sourceRect = CGRect(x: view.bounds.midX, y: view.bounds.midY, width: 0, height: 0)
                          present(av, animated: true)
                      }
                  case "scan":
                      let vc = ScannerViewController()
                      vc.modalPresentationStyle = .fullScreen
                      vc.onCode = { [weak self] code in
                          let e = code.replacingOccurrences(of: "\\", with: "\\\\").replacingOccurrences(of: "'", with: "\\'")
                          self?.webView.evaluateJavaScript("xScanResult('\(e)')", completionHandler: nil)
                      }
                      present(vc, animated: true)
                  default:
                      break
                  }
              }

              func replyAuth(_ id: Int, _ ok: Bool) {
                  webView.evaluateJavaScript("window.__nativeAuth(\(id),\(ok ? "true" : "false"))", completionHandler: nil)
              }

              // ---------- المظهر: الوضع الليلي وحجم الخط ----------
              func applyAppearance() {
                  let d = UserDefaults.standard
                  let night = d.bool(forKey: kNight)
                  let scales: [Double] = [0.9, 1.0, 1.15]
                  let scale = scales[min(2, max(0, d.integer(forKey: kFontScale)))]
                  var css = "body{zoom:\(scale)}"
                  if night {
                      css += "html{filter:invert(1) hue-rotate(180deg);background:#fff}img,video,canvas{filter:invert(1) hue-rotate(180deg)}"
                  }
                  let js = "(function(){var s=document.getElementById('app-style');if(!s){s=document.createElement('style');s.id='app-style';document.head.appendChild(s);}s.textContent='\(css)';})();"
                  webView.evaluateJavaScript(js, completionHandler: nil)
                  view.backgroundColor = night ? .black : .white
              }

              func clearCache() {
                  let types = WKWebsiteDataStore.allWebsiteDataTypes()
                  WKWebsiteDataStore.default().removeData(ofTypes: types, modifiedSince: Date(timeIntervalSince1970: 0)) {
                      DispatchQueue.main.async { self.webView.reload() }
                  }
              }

              // ---------- اختصارات الأيقونة ----------
              func runShortcut() {
                  guard pageLoaded, let t = pendingShortcut else { return }
                  pendingShortcut = nil
                  var js = ""
                  if t == "orders" { js = "showTab('orders')" }
                  else if t == "newProduct" { js = "showTab('products');openAddModal()" }
                  else if t == "stats" { js = "showTab('stats')" }
                  else if t == "manualOrder" { js = "showTab('orders');xManualOrder()" }
                  if !js.isEmpty { webView.evaluateJavaScript(js, completionHandler: nil) }
              }

