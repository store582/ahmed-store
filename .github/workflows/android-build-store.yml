          cat > $J/StatusJob.java <<'EOF'
          package com.albsam.store;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobParameters;
          import android.app.job.JobService;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.json.JSONTokener;

          public class StatusJob extends JobService {
              static final String DB = "https://albsam-store-default-rtdb.firebaseio.com/";

              @Override
              public boolean onStartJob(final JobParameters p) {
                  new Thread(new Runnable() {
                      public void run() {
                          try { checkOrders(); } catch (Exception e) { }
                          try { checkWaits(); } catch (Exception e) { }
                          try { checkPush(); } catch (Exception e) { }
                          try { updateBadge(); } catch (Exception e) { }
                          WidgetProvider.refresh(StatusJob.this);
                          jobFinished(p, false);
                      }
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters p) { return false; }

              boolean flag(String k) {
                  try {
                      SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                      return new JSONObject(sp.getString("flags", "{}")).optBoolean(k, true);
                  } catch (Exception e) { return true; }
              }

              void checkPush() throws Exception {
                  SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                  Object v = fetchJson("settings/push.json");
                  if (!(v instanceof JSONObject)) return;
                  JSONObject p = (JSONObject) v;
                  String id = p.optString("id", "");
                  if (id.length() == 0) return;
                  String last = sp.getString("lastPush", "");
                  if (id.equals(last)) return;
                  sp.edit().putString("lastPush", id).apply();
                  if (last.length() == 0 || !flag("offers")) return;
                  notifyUser(p.optString("title", "مجمع البسام"), p.optString("body", ""), 5000);
              }

              void updateBadge() throws Exception {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                  JSONArray arr = new JSONArray(sp.getString("orders", "[]"));
                  int n = 0;
                  for (int i = 0; i < arr.length(); i++) {
                      if (!isFinal(arr.getJSONObject(i).optString("s", ""))) n++;
                  }
                  if (!flag("badge") || n == 0) { nm.cancel(4000); return; }
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("badge", "الطلبات الجارية", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(true);
                      nm.createNotificationChannel(ch);
                  }
                  Intent in = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 4000, in, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "badge") : new Notification.Builder(this);
                  b.setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle("لديك " + n + " طلبات جارية")
                      .setContentText("اضغط لتتبع طلباتك")
                      .setNumber(n)
                      .setContentIntent(pi);
                  nm.notify(4000, b.build());
              }

              boolean isFinal(String s) {
                  return s.equals("تم التسليم") || s.equals("ملغي") || s.equals("مرتجع");
              }

              void checkOrders() throws Exception {
                  SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                  JSONArray arr = new JSONArray(sp.getString("orders", "[]"));
                  boolean changed = false;
                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject o = arr.getJSONObject(i);
                      String last = o.optString("s", "");
                      if (isFinal(last)) continue;
                      String code = o.optString("c");
                      if (!code.matches("[A-Za-z0-9]+")) continue;
                      Object v = fetchJson("tracking/" + code + "/status.json");
                      String st = v instanceof String ? (String) v : null;
                      if (st == null || st.length() == 0 || st.equals(last)) continue;
                      o.put("s", st);
                      changed = true;
                      boolean quiet = last.length() == 0 && (isFinal(st) || st.equals("جديد"));
                      if (!quiet && !st.equals("جديد") && flag("orders")) notifyUser("حالة الطلب", "طلبك #" + o.optString("n", "") + ": " + msgFor(st), 2000 + i);
                  }
                  if (changed) sp.edit().putString("orders", arr.toString()).apply();
              }

              void checkWaits() throws Exception {
                  SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                  JSONArray arr = new JSONArray(sp.getString("waits", "[]"));
                  String notified = "," + sp.getString("notified", "") + ",";
                  boolean changed = false;
                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject w = arr.getJSONObject(i);
                      String id = w.optString("i");
                      if (!id.matches("[0-9]+")) continue;
                      Object v = fetchJson("products/" + id + ".json");
                      if (!(v instanceof JSONObject)) continue;
                      JSONObject p = (JSONObject) v;
                      boolean avail = !"غير متوفر".equals(p.optString("status"));
                      String stock = p.isNull("stock") ? "" : p.optString("stock", "");
                      if (stock.length() > 0 && stock.matches("-?[0-9]+") && Long.parseLong(stock) <= 0) avail = false;
                      String hid = p.optString("hidden", "");
                      if (hid.equals("true")) avail = false;
                      boolean was = notified.contains("," + id + ",");
                      if (avail && !was && flag("waits")) {
                          String name = p.optString("name", w.optString("n", ""));
                          notifyUser("توفر المنتج", "توفر الآن: " + name, 3000 + (int) (Long.parseLong(id) % 1000));
                          notified = notified + id + ",";
                          changed = true;
                      } else if (!avail && was) {
                          notified = notified.replace("," + id + ",", ",");
                          changed = true;
                      }
                  }
                  if (changed) sp.edit().putString("notified", notified.replaceAll("^,|,$", "")).apply();
              }

              Object fetchJson(String path) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(DB + path).openConnection();
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                      r.close();
                      return new JSONTokener(sb.toString()).nextValue();
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              String msgFor(String st) {
                  if (st.equals("قيد التجهيز")) return "قيد التجهيز الآن";
                  if (st.equals("خرج للتوصيل")) return "خرج للتوصيل 🚚";
                  if (st.equals("تم التسليم")) return "تم التسليم ✅";
                  if (st.equals("ملغي")) return "تم إلغاؤه";
                  return st;
              }

              void notifyUser(String title, String text, int id) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel("orders", "إشعارات المتجر", NotificationManager.IMPORTANCE_HIGH));
                  }
                  Intent in = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, id, in, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "orders") : new Notification.Builder(this);
                  b.setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setAutoCancel(true)
                      .setContentIntent(pi);
                  nm.notify(id, b.build());
              }
          }
          EOF
          cat > $J/Topics.java <<'EOF'
          package com.albsam.store;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.google.android.gms.tasks.OnCompleteListener;
          import com.google.android.gms.tasks.Task;
          import com.google.firebase.messaging.FirebaseMessaging;
          import java.util.HashSet;
          import java.util.Set;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Topics {
              static boolean isFinal(String s) {
                  return s.equals("تم التسليم") || s.equals("ملغي") || s.equals("مرتجع");
              }

              static synchronized Set<String> load(Context c) {
                  Set<String> s = new HashSet<String>();
                  String saved = c.getSharedPreferences("albsam", Context.MODE_PRIVATE).getString("topics", "");
                  if (saved.length() > 0) {
                      for (String t : saved.split(",")) { if (t.length() > 0) s.add(t); }
                  }
                  return s;
              }

              static synchronized void mark(Context c, String topic, boolean add) {
                  Set<String> s = load(c);
                  if (add) s.add(topic); else s.remove(topic);
                  StringBuilder sb = new StringBuilder();
                  for (String t : s) { if (sb.length() > 0) sb.append(','); sb.append(t); }
                  c.getSharedPreferences("albsam", Context.MODE_PRIVATE).edit().putString("topics", sb.toString()).apply();
              }

              // يضبط اشتراكات الإشعارات الفورية: العروض + كل طلب جارٍ + كل منتج ينتظر توفره
              static void sync(final Context ctx) {
                  try {
                      final Context c = ctx.getApplicationContext();
                      SharedPreferences sp = c.getSharedPreferences("albsam", Context.MODE_PRIVATE);
                      JSONObject fl = new JSONObject(sp.getString("flags", "{}"));
                      Set<String> want = new HashSet<String>();
                      if (fl.optBoolean("offers", true)) want.add("offers");
                      if (fl.optBoolean("orders", true)) {
                          JSONArray a = new JSONArray(sp.getString("orders", "[]"));
                          for (int i = 0; i < a.length(); i++) {
                              JSONObject o = a.getJSONObject(i);
                              String code = o.optString("c");
                              if (code.matches("[A-Za-z0-9]+") && !isFinal(o.optString("s", ""))) want.add("o_" + code);
                          }
                      }
                      if (fl.optBoolean("waits", true)) {
                          JSONArray w = new JSONArray(sp.getString("waits", "[]"));
                          for (int i = 0; i < w.length(); i++) {
                              String id = w.getJSONObject(i).optString("i");
                              if (id.matches("[0-9]+")) want.add("w_" + id);
                          }
                      }
                      Set<String> have = load(c);
                      FirebaseMessaging fm = FirebaseMessaging.getInstance();
                      for (final String t : want) {
                          if (have.contains(t)) continue;
                          fm.subscribeToTopic(t).addOnCompleteListener(new OnCompleteListener<Void>() {
                              public void onComplete(Task<Void> task) { if (task.isSuccessful()) mark(c, t, true); }
                          });
                      }
                      for (final String t : have) {
                          if (want.contains(t)) continue;
                          fm.unsubscribeFromTopic(t).addOnCompleteListener(new OnCompleteListener<Void>() {
                              public void onComplete(Task<Void> task) { if (task.isSuccessful()) mark(c, t, false); }
                          });
                      }
                  } catch (Exception e) { }
              }
          }
          EOF
          cat > $J/PushService.java <<'EOF'
          package com.albsam.store;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class PushService extends FirebaseMessagingService {
              boolean flag(String k) {
                  try {
                      SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                      return new JSONObject(sp.getString("flags", "{}")).optBoolean(k, true);
                  } catch (Exception e) { return true; }
              }

              @Override
              public void onNewToken(String token) { }

              @Override
              public void onMessageReceived(RemoteMessage m) {
                  try {
                      Map<String, String> d = m.getData();
                      String type = d.get("type");
                      if (type == null) return;
                      SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                      String title = d.get("title") == null ? "مجمع البسام" : d.get("title");
                      String body = d.get("body") == null ? "" : d.get("body");
                      if (type.equals("offer")) {
                          String id = d.get("id");
                          if (id != null && id.length() > 0) {
                              if (id.equals(sp.getString("lastPush", ""))) return;
                              sp.edit().putString("lastPush", id).apply();
                          }
                          if (flag("offers")) notifyUser(title, body, 5000);
                      } else if (type.equals("order")) {
                          String code = d.get("code");
                          String st = d.get("status");
                          if (code == null || st == null) return;
                          JSONArray arr = new JSONArray(sp.getString("orders", "[]"));
                          boolean known = false, same = false;
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject o = arr.getJSONObject(i);
                              if (code.equals(o.optString("c"))) {
                                  known = true;
                                  if (st.equals(o.optString("s", ""))) same = true; else o.put("s", st);
                              }
                          }
                          if (known && same) return;
                          if (known) sp.edit().putString("orders", arr.toString()).apply();
                          WidgetProvider.refresh(this);
                          if (flag("orders") && !st.equals("جديد")) notifyUser(title, body, 2000 + (code.hashCode() & 255));
                          Topics.sync(this);
                      } else if (type.equals("wait")) {
                          String id = d.get("id");
                          if (id == null || !id.matches("[0-9]+")) return;
                          String notified = "," + sp.getString("notified", "") + ",";
                          if (notified.contains("," + id + ",")) return;
                          notified = notified + id + ",";
                          sp.edit().putString("notified", notified.replaceAll("^,|,$", "")).apply();
                          if (flag("waits")) notifyUser(title, body, 3000 + (int) (Long.parseLong(id) % 1000));
                      }
                  } catch (Exception e) { }
              }

              void notifyUser(String title, String text, int id) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel("orders", "إشعارات المتجر", NotificationManager.IMPORTANCE_HIGH));
                  }
                  Intent in = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, id, in, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "orders") : new Notification.Builder(this);
                  b.setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setAutoCancel(true)
                      .setContentIntent(pi);
                  nm.notify(id, b.build());
              }
          }
          EOF
          SRC=""
          for f in apple-touch-icon.png icon-512.png icon-192.png; do
            if [ -f "$f" ]; then SRC="$f"; break; fi
          done
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; sz=${pair##*:}
            mkdir -p $R/mipmap-$d
            if [ -n "$SRC" ]; then
              convert "$SRC" -resize ${sz}x${sz}^ -gravity center -extent ${sz}x${sz} $R/mipmap-$d/ic_launcher.png
            else
              convert -size ${sz}x${sz} xc:'#0a3622' $R/mipmap-$d/ic_launcher.png
            fi
          done

      - name: Apply store config
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          global.window={};eval(fs.readFileSync("config.js","utf8"));
          const S=window.STORE;
          const u=new URL(S.pagesUrl);
          const base=S.pagesUrl.replace(/\/?$/,"/");
          const pth=u.pathname.replace(/\/$/,"");
          const db=new URL(S.firebase.databaseURL).host;
          const R=[
            ["https://bsamjasm.github.io/albsam_store/",base],
            ["bsamjasm.github.io",u.host],
            ["/albsam_store\"",pth+"\""],
            ["albsam-store-default-rtdb.firebaseio.com",db],
            ["com.albsam.store",S.packageName],
            ["مجمع البسام",S.name],
            ["0A3622",S.color.replace("#","").toUpperCase()],
            ["0a3622",S.color.replace("#","").toLowerCase()]
          ];
          (function walk(d){for(const f of fs.readdirSync(d)){const p=path.join(d,f);
            if(fs.statSync(p).isDirectory()){walk(p);continue}
            if(!/\.(java|xml|gradle)$/.test(f))continue;
            let s=fs.readFileSync(p,"utf8"),o=s;
            for(const [a,b] of R)s=s.split(a).join(b);
            if(s!==o)fs.writeFileSync(p,s)}})("android-app");
          '
          OLD=android-app/app/src/main/java/com/albsam/store
          NEW=android-app/app/src/main/java/$(node -e 'global.window={};eval(require("fs").readFileSync("config.js","utf8"));console.log(window.STORE.packageName.replace(/\./g,"/"))')
          if [ "$OLD" != "$NEW" ]; then mkdir -p "$NEW" && mv $OLD/* "$NEW"/; fi

      - name: Add Firebase config
        run: |
          if [ ! -f google-services.json ]; then
            echo "الملف google-services.json غير موجود في المستودع (الصفحة الرئيسية بجانب index.html)"
            exit 1
          fi
          cp google-services.json android-app/app/google-services.json

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KS_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KS_PASS }}
          KS_ALIAS_SECRET: ${{ secrets.KS_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS_SECRET" ] || [ -z "$KS_ALIAS_SECRET" ]; then
            echo "ناقص سر من GitHub Secrets: KS_BASE64 / KS_PASS / KS_ALIAS (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "::add-mask::$KS_PASS_SECRET"
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/store.jks
          echo "KS_PATH=$RUNNER_TEMP/store.jks" >> $GITHUB_ENV
          echo "KS_PASS=$KS_PASS_SECRET" >> $GITHUB_ENV
          echo "KS_ALIAS=$KS_ALIAS_SECRET" >> $GITHUB_ENV
          echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd android-app
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AlbsamStore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlbsamStore-APK
          path: AlbsamStore.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-apk
          name: تطبيق مجمع البسام (أندرويد)
          body: حمّل الملف AlbsamStore.apk وثبّته على جوال أندرويد.
          files: AlbsamStore.apk

      - name: Show link
        run: |
          echo "رابط التحميل: https://github.com/${{ github.repository }}/releases/download/store-apk/AlbsamStore.apk" >> $GITHUB_STEP_SUMMARY
