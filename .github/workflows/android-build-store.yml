name: Build Android Store APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          P=android-app
          J=$P/app/src/main/java/com/albsam/store
          R=$P/app/src/main/res
          mkdir -p $J $R/values

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AlbsamStore"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.albsam.store'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.albsam.store'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('RUN_NUMBER') ?: '1')
                  versionName '1.0'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_PATH'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-messaging'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="fullUser"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|fontScale|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="bsamjasm.github.io" android:pathPrefix="/albsam_store" />
                      </intent-filter>
                      <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />
                  </activity>
                  <receiver android:name=".WidgetProvider" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>
                  <service
                      android:name=".StatusJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <service android:name=".PushService" android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > $R/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">مجمع البسام</string>
              <string name="sc_track">تتبع طلبي</string>
              <string name="sc_cart">سلة المشتريات</string>
          </resources>
          EOF

          cat > $R/values/styles.xml <<'EOF'
          <resources>
              <color name="store_green">#0A3622</color>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/store_green</item>
                  <item name="android:statusBarColor">@color/store_green</item>
                  <item name="android:navigationBarColor">@color/store_green</item>
              </style>
          </resources>
          EOF

          mkdir -p $R/values-v31 $R/drawable $R/xml $R/layout
          cat > $R/layout/widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="12dp"
              android:background="@color/store_green">
              <TextView
                  android:id="@+id/w_title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#FCD34D"
                  android:textStyle="bold"
                  android:textSize="14sp" />
              <TextView
                  android:id="@+id/w_line"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp" />
          </LinearLayout>
          EOF

          cat > $R/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="60dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat > $J/WidgetProvider.java <<'EOF'
          package com.albsam.store;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class WidgetProvider extends AppWidgetProvider {
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) m.updateAppWidget(id, build(c));
              }

              static RemoteViews build(Context c) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
                  String line = "لا توجد طلبات";
                  try {
                      SharedPreferences sp = c.getSharedPreferences("albsam", Context.MODE_PRIVATE);
                      JSONArray a = new JSONArray(sp.getString("orders", "[]"));
                      if (a.length() > 0) {
                          JSONObject o = a.getJSONObject(0);
                          String s = o.optString("s", "");
                          line = "طلب #" + o.optString("n", "") + ": " + (s.length() == 0 ? "جديد" : s);
                      }
                  } catch (Exception e) { }
                  v.setTextViewText(R.id.w_title, "مجمع البسام");
                  v.setTextViewText(R.id.w_line, line);
                  Intent in = new Intent(c, MainActivity.class);
                  in.setAction(Intent.ACTION_VIEW);
                  in.setData(Uri.parse("https://bsamjasm.github.io/albsam_store/?open=track"));
                  v.setOnClickPendingIntent(R.id.w_root, PendingIntent.getActivity(c, 0, in, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));
                  return v;
              }

              static void refresh(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, WidgetProvider.class));
                      for (int id : ids) m.updateAppWidget(id, build(c));
                  } catch (Exception e) { }
              }
          }
          EOF
          cat > $R/xml/shortcuts.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut android:shortcutId="track" android:enabled="true" android:icon="@mipmap/ic_launcher" android:shortcutShortLabel="@string/sc_track" android:shortcutLongLabel="@string/sc_track">
                  <intent android:action="android.intent.action.VIEW" android:targetPackage="com.albsam.store" android:targetClass="com.albsam.store.MainActivity" android:data="https://bsamjasm.github.io/albsam_store/?open=track" />
              </shortcut>
              <shortcut android:shortcutId="cart" android:enabled="true" android:icon="@mipmap/ic_launcher" android:shortcutShortLabel="@string/sc_cart" android:shortcutLongLabel="@string/sc_cart">
                  <intent android:action="android.intent.action.VIEW" android:targetPackage="com.albsam.store" android:targetClass="com.albsam.store.MainActivity" android:data="https://bsamjasm.github.io/albsam_store/?open=cart" />
              </shortcut>
          </shortcuts>
          EOF
          cat > $R/drawable/splash_empty.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00000000" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          EOF

          cat > $R/values-v31/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/store_green</item>
                  <item name="android:statusBarColor">@color/store_green</item>
                  <item name="android:navigationBarColor">@color/store_green</item>
                  <item name="android:windowSplashScreenBackground">@color/store_green</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_empty</item>
                  <item name="android:windowSplashScreenAnimationDuration">0</item>
              </style>
          </resources>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.albsam.store;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.ComponentName;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.app.job.JobInfo;
          import android.app.job.JobScheduler;
          import android.os.Build;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.PermissionRequest;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.view.animation.Animation;
          import android.view.animation.ScaleAnimation;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              static final String HOME = "https://bsamjasm.github.io/albsam_store/";
              WebView web;
              View overlay;
              boolean splashDone = false;
              PermissionRequest pendingPerm = null;
              long startMs;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  startMs = System.currentTimeMillis();
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0A3622);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF0A3622);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  overlay = buildSplash();
                  root.addView(overlay, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  web.postDelayed(new Runnable() { public void run() { hideSplash(); } }, 8000);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          if (!r.isForMainFrame()) return false;
                          return handle(r.getUrl());
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          if (url != null && url.startsWith("https")) hideSplash();
                      }
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) { showOffline(); splashDone = false; hideSplash(); }
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  if (checkSelfPermission("android.permission.CAMERA") == PackageManager.PERMISSION_GRANTED) {
                                      request.grant(request.getResources());
                                  } else {
                                      pendingPerm = request;
                                      requestPermissions(new String[]{"android.permission.CAMERA"}, 2);
                                  }
                              }
                          });
                      }
                  });
                  web.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void share(final String text) {
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  Intent i = new Intent(Intent.ACTION_SEND);
                                  i.setType("text/plain");
                                  i.putExtra(Intent.EXTRA_TEXT, text);
                                  startActivity(Intent.createChooser(i, "مشاركة"));
                              }
                          });
                      }
                      @android.webkit.JavascriptInterface
                      public void setOrders(String json) {
                          try {
                              SharedPreferences sp = getSharedPreferences("albsam", Context.MODE_PRIVATE);
                              JSONArray old = new JSONArray(sp.getString("orders", "[]"));
                              JSONArray nw = new JSONArray(json);
                              for (int a = 0; a < nw.length(); a++) {
                                  JSONObject o = nw.getJSONObject(a);
                                  for (int b = 0; b < old.length(); b++) {
                                      JSONObject p = old.getJSONObject(b);
                                      if (p.optString("c").equals(o.optString("c"))) { o.put("s", p.optString("s", "")); break; }
                                  }
                              }
                              sp.edit().putString("orders", nw.toString()).apply();
                              WidgetProvider.refresh(MainActivity.this);
                              Topics.sync(MainActivity.this);
                          } catch (Exception e) { }
                      }
                      @android.webkit.JavascriptInterface
                      public int version() {
                          try { return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode; } catch (Exception e) { return 0; }
                      }
                      @android.webkit.JavascriptInterface
                      public void setFlags(String json) {
                          try {
                              new JSONObject(json);
                              getSharedPreferences("albsam", Context.MODE_PRIVATE).edit().putString("flags", json).apply();
                              Topics.sync(MainActivity.this);
                          } catch (Exception e) { }
                      }
                      @android.webkit.JavascriptInterface
                      public void shareImg(final String text, final String src) {
                          new Thread(new Runnable() {
                              public void run() {
                                  Uri uri = null;
                                  try {
                                      Bitmap bm = null;
                                      if (src != null && src.startsWith("data:")) {
                                          byte[] bytes = Base64.decode(src.substring(src.indexOf(',') + 1), Base64.DEFAULT);
                                          bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                                      } else if (src != null && src.startsWith("http")) {
                                          HttpURLConnection c = (HttpURLConnection) new URL(src).openConnection();
                                          c.setConnectTimeout(10000);
                                          c.setReadTimeout(10000);
                                          bm = BitmapFactory.decodeStream(c.getInputStream());
                                          c.disconnect();
                                      }
                                      if (bm != null && Build.VERSION.SDK_INT >= 29) {
                                          ContentValues cv = new ContentValues();
                                          cv.put(MediaStore.Images.Media.DISPLAY_NAME, "albsam_" + System.currentTimeMillis() + ".jpg");
                                          cv.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                                          cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Albsam");
                                          uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
                                          if (uri != null) {
                                              OutputStream os = getContentResolver().openOutputStream(uri);
                                              bm.compress(Bitmap.CompressFormat.JPEG, 90, os);
                                              os.close();
                                          }
                                      }
                                  } catch (Exception e) { uri = null; }
                                  final Uri fu = uri;
                                  runOnUiThread(new Runnable() {
                                      public void run() {
                                          Intent it = new Intent(Intent.ACTION_SEND);
                                          if (fu != null) {
                                              it.setType("image/jpeg");
                                              it.putExtra(Intent.EXTRA_STREAM, fu);
                                              it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          } else {
                                              it.setType("text/plain");
                                          }
                                          it.putExtra(Intent.EXTRA_TEXT, text);
                                          startActivity(Intent.createChooser(it, "مشاركة"));
                                      }
                                  });
                              }
                          }).start();
                      }
                      @android.webkit.JavascriptInterface
                      public void setWaits(String json) {
                          try {
                              new JSONArray(json);
                              getSharedPreferences("albsam", Context.MODE_PRIVATE).edit().putString("waits", json).apply();
                              Topics.sync(MainActivity.this);
                          } catch (Exception e) { }
                      }
                      @android.webkit.JavascriptInterface
                      public String paste() {
                          try {
                              ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cm != null && cm.hasPrimaryClip()) {
                                  ClipData d = cm.getPrimaryClip();
                                  if (d != null && d.getItemCount() > 0) {
                                      CharSequence t = d.getItemAt(0).coerceToText(MainActivity.this);
                                      return t == null ? "" : t.toString();
                                  }
                              }
                          } catch (Exception e) { }
                          return "";
                      }
                  }, "AlbsamApp");
                  if (saved == null || web.restoreState(saved) == null) web.loadUrl(startUrl(getIntent()));
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  Topics.sync(this);
                  try {
                      JobScheduler js = (JobScheduler) getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      JobInfo info = new JobInfo.Builder(1001, new ComponentName(this, StatusJob.class))
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPeriodic(15 * 60 * 1000L)
                          .setPersisted(true)
                          .build();
                      js.schedule(info);
                  } catch (Exception e) { }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == 2 && pendingPerm != null) {
                      if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) pendingPerm.grant(pendingPerm.getResources());
                      else pendingPerm.deny();
                      pendingPerm = null;
                  }
              }

              String startUrl(Intent i) {
                  Uri u = i == null ? null : i.getData();
                  if (u != null && "https".equals(u.getScheme()) && "bsamjasm.github.io".equals(u.getHost())) return u.toString();
                  return HOME;
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  web.loadUrl(startUrl(i));
              }

              View buildSplash() {
                  float d = getResources().getDisplayMetrics().density;
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setBackgroundColor(0xFF0A3622);
                  l.setClickable(true);
                  ImageView iv = new ImageView(this);
                  iv.setImageResource(R.mipmap.ic_launcher);
                  int px = (int) (110 * d);
                  l.addView(iv, new LinearLayout.LayoutParams(px, px));
                  ScaleAnimation pulse = new ScaleAnimation(0.92f, 1.08f, 0.92f, 1.08f, Animation.RELATIVE_TO_SELF, 0.5f, Animation.RELATIVE_TO_SELF, 0.5f);
                  pulse.setDuration(900);
                  pulse.setRepeatMode(Animation.REVERSE);
                  pulse.setRepeatCount(Animation.INFINITE);
                  pulse.setInterpolator(new AccelerateDecelerateInterpolator());
                  iv.startAnimation(pulse);
                  TextView t1 = new TextView(this);
                  t1.setText("أهلاً بكم");
                  t1.setTextColor(0xFFFCD34D);
                  t1.setTextSize(14);
                  t1.setGravity(Gravity.CENTER);
                  t1.setAlpha(0f);
                  LinearLayout.LayoutParams p1 = new LinearLayout.LayoutParams(-2, -2);
                  p1.topMargin = (int) (18 * d);
                  l.addView(t1, p1);
                  TextView t2 = new TextView(this);
                  t2.setText("مجمع البسام");
                  t2.setTextColor(0xFFFFFFFF);
                  t2.setTextSize(26);
                  t2.setTypeface(Typeface.DEFAULT_BOLD);
                  t2.setGravity(Gravity.CENTER);
                  t2.setAlpha(0f);
                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(-2, -2);
                  p2.topMargin = (int) (4 * d);
                  l.addView(t2, p2);
                  t1.animate().alpha(1f).setStartDelay(200).setDuration(500).start();
                  t2.animate().alpha(1f).setStartDelay(400).setDuration(500).start();
                  return l;
              }

              void hideSplash() {
                  if (splashDone || overlay == null) return;
                  splashDone = true;
                  long wait = Math.max(0, 1200 - (System.currentTimeMillis() - startMs));
                  overlay.postDelayed(new Runnable() {
                      public void run() {
                          overlay.animate().alpha(0f).setDuration(400).withEndAction(new Runnable() {
                              public void run() { overlay.setVisibility(View.GONE); }
                          }).start();
                      }
                  }, wait);
              }

              boolean handle(Uri u) {
                  String scheme = u.getScheme();
                  if (scheme == null) return false;
                  String path = u.getPath() == null ? "" : u.getPath();
                  if (scheme.equals("https") && "bsamjasm.github.io".equals(u.getHost()) && path.startsWith("/albsam_store")) return false;
                  if (scheme.equals("about") || scheme.equals("data") || scheme.equals("blob")) return false;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                  } catch (ActivityNotFoundException e) { }
                  return true;
              }

              void showOffline() {
                  String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                      + "<body style='margin:0;background:#0a3622;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;direction:rtl'>"
                      + "<div style='font-size:42px'>📡</div>"
                      + "<h3>لا يوجد اتصال بالإنترنت</h3>"
                      + "<p style='opacity:.8'>تأكد من الاتصال ثم أعد المحاولة</p>"
                      + "<button onclick=\"location.href='" + HOME + "'\" style='background:#fbbf24;color:#0a3622;border:0;border-radius:12px;padding:12px 28px;font-size:16px;font-weight:bold'>إعادة المحاولة</button>"
                      + "</body></html>";
                  web.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }
          }
